{% extends "d_app/base.html" %}
{% block page_header %}
    <h5>欢迎来到删除日记种类的页面</h5>
{% endblock page_header %}
{% block content %}
    <p>此操作将删除这个{{ diary.title }}日记种类，以及所有相关的日记正文。谨慎</p>
    <form action="{% url 'd_app:del_diary' diary_id=diary.id %}" method='post'>
        {% csrf_token %}
        <button type='submit'>确认删除</button>
        <a href="{% url 'd_app:diary' diary_di=diary.id %}">点此处取消删除</a>
    </form>
{% endblock content %}
