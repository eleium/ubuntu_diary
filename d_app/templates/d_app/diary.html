{% extends "d_app/base.html" %}
{% block page_header %}
    <h5>欢迎来到已经写好的 {{ diary.title }}的日记正文</h5>
{% endblock page_header %}
{% block content %}
    <ul>
        {% for entry in entries %}
            <li>
                <a href="{% url 'd_app:entry' diary_id=diary.id entry_id=entry.id %}">请看正文</a>
            </li>
        {% empty %}
            <li>添加正文</li>
        {% endfor %}
    </ul>
{% endblock content %}
